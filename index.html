<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Throne Bosses</title>
  <meta name="theme-color" content="#f7f8f4">
  <meta name="description" content="A mobile-friendly Throne and Liberty boss spawn calendar.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
:root { --ink: #18251f; --muted: #6e7b73; --line: #dce5dd; --paper: #f7f8f4; --card: #ffffff; --mint: #c9efdc; --mint-strong: #176b4a; --coral: #ff8f70; --shadow: 0 20px 50px rgba(43, 75, 59, 0.08); }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: radial-gradient(circle at 85% 8%, #e7f6eb 0, transparent 30%), var(--paper); font-family: Manrope, sans-serif; }
button, input { font: inherit; } button { cursor: pointer; }
.app-shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 58px 0 48px; }
.masthead { display: flex; justify-content: space-between; align-items: end; gap: 32px; }
.eyebrow { color: var(--mint-strong); font: 500 11px/1 DM Mono, monospace; letter-spacing: .12em; margin: 0 0 14px; }
h1, h2, p { margin-top: 0; } h1 { font-size: clamp(36px, 6vw, 72px); letter-spacing: -.06em; line-height: .98; margin-bottom: 16px; }
.lede { color: var(--muted); font-size: 16px; margin-bottom: 0; }
.status { background: var(--card); border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font: 12px DM Mono, monospace; padding: 11px 15px; white-space: nowrap; }
.controls { display: flex; gap: 10px; margin: 42px 0 18px; }
.search-wrap { align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 8px; display: flex; flex: 1; gap: 10px; padding: 0 14px; box-shadow: var(--shadow); }
.search-icon { color: var(--mint-strong); font-size: 25px; line-height: 0; transform: translateY(-2px); }
input { background: none; border: 0; color: var(--ink); min-width: 0; outline: 0; padding: 15px 0; width: 100%; } input::placeholder { color: #a0aaa2; }
kbd { border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font: 12px DM Mono, monospace; padding: 3px 6px; }
.today-button { background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); font-size: 12px; padding: 8px 12px; }
.today-button:hover { background: var(--mint); border-color: var(--mint); }
.boss-picker { display: flex; flex-wrap: wrap; gap: 8px; min-height: 38px; }
.boss-chip { align-items: center; background: transparent; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); display: inline-flex; font-size: 12px; gap: 6px; padding: 8px 12px; }
.boss-chip:hover, .boss-chip.active { background: var(--mint); border-color: var(--mint); color: var(--ink); }
.favorite-mark { color: var(--muted); line-height: 1; }
.boss-chip.active .favorite-mark { color: var(--mint-strong); }
.selected-boss { align-items: end; display: flex; justify-content: space-between; margin: 54px 0 24px; }
.selected-boss h2 { font-size: 31px; letter-spacing: -.04em; margin-bottom: 0; }
.selected-boss #favorite-list { color: var(--muted); display: flex; flex-wrap: wrap; font-size: 13px; gap: 10px; margin: 8px 0 0; }
.favorite-name { align-items: center; display: inline-flex; gap: 5px; }
.color-swatch { border-radius: 50%; display: inline-block; height: 9px; width: 9px; }
.color-swatch.favorite-0 { background: var(--mint); border: 1px solid #9dd3b7; } .color-swatch.favorite-1 { background: #dce7ff; border: 1px solid #a8bfe9; } .color-swatch.favorite-2 { background: #eadcff; border: 1px solid #c1aee2; } .color-swatch.favorite-3 { background: #d9f0ed; border: 1px solid #9acfc7; } .color-swatch.favorite-4 { background: #f3dfc9; border: 1px solid #d8b58d; }
.next-spawn { color: var(--mint-strong); font: 500 13px DM Mono, monospace; margin-bottom: 4px; text-align: right; }
.calendar-section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.calendar-heading { align-items: center; display: flex; justify-content: center; gap: 18px; padding: 20px; }
.calendar-heading h2 { font-size: 18px; margin: 0; min-width: 165px; text-align: center; }
.calendar-note { color: var(--muted); font: 10px DM Mono, monospace; margin: 5px 0 0; text-align: center; }
.icon-button { background: transparent; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); font-size: 18px; height: 34px; width: 34px; }
.icon-button:disabled { color: #b0bab2; cursor: not-allowed; opacity: .65; }
.icon-button:hover { background: var(--mint); border-color: var(--mint); }
.calendar-viewport { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.calendar { display: grid; grid-template-columns: repeat(7, minmax(104px, 1fr)); min-width: 728px; border-top: 1px solid var(--line); }
.weekday { color: var(--muted); font: 500 10px DM Mono, monospace; letter-spacing: .08em; padding: 13px 12px; }
.day { border-right: 1px solid var(--line); border-top: 1px solid var(--line); min-height: 126px; padding: 11px 12px; }
.day:nth-child(7n) { border-right: 0; } .day.muted { background: #fbfcfa; color: #b0bab2; } .day.today { background: #f0faf3; } .day.past { position: relative; } .day.past::after { background: repeating-linear-gradient(135deg, transparent 0, transparent 9px, rgba(110, 123, 115, .08) 9px, rgba(110, 123, 115, .08) 10px); content: ''; inset: 0; pointer-events: none; position: absolute; } .day.past .spawn { opacity: .65; }
.day.empty { background: #fbfcfa; }
.day-number { color: var(--muted); font: 500 12px DM Mono, monospace; }
.day-header { align-items: center; display: flex; justify-content: space-between; }
.copy-button { background: transparent; border: 0; color: var(--muted); cursor: pointer; font: 14px/1 Manrope, sans-serif; opacity: 0; padding: 3px; }
.day:hover .copy-button, .day:focus-within .copy-button, .spawn:hover .copy-button, .spawn:focus-within .copy-button { opacity: 1; }
.copy-button:hover, .copy-button:focus-visible { color: var(--mint-strong); }
.day.today .day-number { background: var(--coral); border-radius: 50%; color: white; display: inline-grid; height: 25px; place-items: center; width: 25px; }
.spawn { background: var(--mint); border-radius: 4px; color: var(--ink); display: block; font: 500 11px DM Mono, monospace; margin-top: 10px; padding: 6px; }

.footnote a { color: var(--mint-strong); } .legend.predicted { color: #a36d00; }
.mobile-only { display: none; }
.sr-only { clip: rect(0, 0, 0, 0); clip-path: inset(50%); height: 1px; overflow: hidden; position: absolute; white-space: nowrap; width: 1px; }
@media (max-width: 700px) { .app-shell { padding-top: 34px; width: min(100% - 24px, 560px); } .masthead, .selected-boss { align-items: start; flex-direction: column; } .status { align-self: start; } .controls { margin-top: 30px; } .selected-boss { gap: 12px; margin-top: 38px; } .next-spawn { text-align: left; } .boss-picker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: 176px; overflow-y: auto; padding: 2px 2px 6px; } .boss-chip { border-radius: 6px; justify-content: flex-start; min-width: 0; overflow: hidden; padding: 9px 8px; text-align: left; } .boss-chip > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .mobile-only { display: inline-block; } .calendar-section.hide-past .day.past { display: none; } .calendar-heading { flex-wrap: wrap; gap: 10px; padding: 16px 12px; } .calendar-heading > div { flex: 1 1 100%; order: -1; } .calendar-heading h2 { min-width: 0; } .calendar-heading .today-button { margin-left: auto; } .calendar-viewport { overflow-x: hidden; } .calendar { display: block; min-width: 0; } .weekday, .day.empty, .day:not(:has(.spawn)) { display: none; } .day { align-items: start; display: grid; gap: 0 10px; grid-template-columns: 42px 1fr; min-height: 0; padding: 13px 12px; } .day-header { grid-column: 1; grid-row: 1; } .spawn { grid-column: 2; margin-top: 0; } .spawn + .spawn { margin-top: 5px; } .day.today .day-number { height: 28px; width: 28px; } .spawn { font-size: 10px; padding: 7px; } .copy-button { opacity: 1; } .footnote { text-align: left; } }

  <main class="app-shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">THRONE & LIBERTY</p>
        <h1>Boss calendar</h1>
      </div>
    </header>

    <section class="controls" aria-label="Boss controls">
      <label class="search-wrap">
        <span class="sr-only">Search for a boss</span>
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="boss-search" type="search" placeholder="Search bosses" autocomplete="off">
      </label>
    </section>

    <section class="boss-picker" id="boss-picker" aria-label="Bosses"></section>

    <section class="selected-boss" aria-live="polite">
      <div>
        <p class="eyebrow">FAVORITES</p>
        <h2 id="selected-name">Choose bosses</h2>
        <p id="favorite-list">Select bosses above to add them here.</p>
      </div>
      <p class="next-spawn" id="next-spawn">Search above to get started.</p>
    </section>

    <section class="calendar-section hide-past">
      <div class="calendar-heading">
        <button class="icon-button" id="previous-month" type="button" aria-label="Previous month">←</button>
        <div>
          <h2 id="month-label"></h2>
          <p class="calendar-note">14-day rotation projected forward</p>
        </div>
        <button class="today-button" id="today-button" type="button">Today</button>
        <button class="today-button mobile-only" id="toggle-past" type="button" aria-pressed="false">Show past</button>
        <button class="icon-button" id="next-month" type="button" aria-label="Next month">→</button>
      </div>
      <div class="calendar-viewport" tabindex="0" aria-label="Scrollable calendar">
        <div class="calendar" id="calendar" role="grid" aria-label="Boss spawn calendar"></div>
      </div>
    </section>

    <p class="footnote">Local time · 14-day rotation · <span class="legend predicted">Predicted Arch</span> · <a href="https://thronewatch.app/" target="_blank" rel="noreferrer">Throne Watch data</a></p>

function addDays(key, amount) { const date = new Date(`${key}T12:00:00Z`); date.setUTCDate(date.getUTCDate() + amount); return date.toISOString().slice(0, 10); }
function dayDifference(from, to) { return Math.round((new Date(`${to}T12:00:00Z`) - new Date(`${from}T12:00:00Z`)) / 86400000); }
function prettyName(value) { return value.replace(/_asc\b/g, ' Ascended').replace(/_/g, ' ').replace(/\b\w/g, (letter) => letter.toUpperCase()); }

function normalizeBossId(name) { const aliases = { 'Ascended Delu': 'deluzhnoa_asc', 'Ascended Queen Bell': 'queen_bellandir_asc' }; if (aliases[name]) return aliases[name]; const entry = Object.entries(state.schedule._bossIds || {}).find(([label]) => label.toLowerCase() === name.toLowerCase()); return entry ? entry[1] : name; }
function rotationAnchor(anchors, key) { return anchors.filter((anchor) => anchor.effectiveDate <= key).sort((a, b) => b.effectiveDate.localeCompare(a.effectiveDate))[0]; }
function eventsForDate(key) { const { rotationSchedule } = state.schedule; const tier = rotationSchedule.tiers.t4; const anchor = rotationAnchor(rotationSchedule.t4Anchors || [{ effectiveDate: rotationSchedule.t4Start, cycleDay: 1 }], key); const gameDay = dayDifference(anchor.effectiveDate, key); const cycle = tier.cycleDays || 14; const rotationDay = ((anchor.cycleDay - 1 + gameDay) % cycle + cycle) % cycle + 1; const events = []; Object.entries(tier.days[String(rotationDay)] || {}).forEach(([slot, value]) => events.push(...eventEntries(key, tier.slots[slot], value))); (rotationSchedule.dateExtras?.[key] || []).forEach((entry) => events.push(...eventEntries(key, entry.time, entry.items, true))); return events; }
function eventDisplayName(id) { const entry = Object.entries(state.schedule._bossIds || {}).find(([, bossId]) => bossId === id); return entry ? entry[0] : prettyName(id); }
function eventEntries(gameDate, time, value, predicted = false) { if (!time) return []; return parseItems(value).map((item) => { const name = normalizeBossId(item.name); return { name, gameDate, time, displayName: eventDisplayName(name), guildPvp: item.guildPvp, predicted: predicted && ARCH_BOSS_IDS.has(name) }; }); }
function isFavorite(event) { return state.favorites.includes(event.name); }
function savedFavorites() { try { return JSON.parse(localStorage.getItem('throne-bosses-favorites') || '[]'); } catch (error) { return []; } }
function eventDate(event) { return Number(event.time.split(':')[0]) < 3 ? addDays(event.gameDate, 1) : event.gameDate; }
function centralWallToInstant(date, time) { const [year, month, day] = date.split('-').map(Number); const [hours, minutes] = time.split(':').map(Number); let instant = new Date(Date.UTC(year, month - 1, day, hours, minutes)); const parts = new Intl.DateTimeFormat('en-CA', { timeZone: CENTRAL, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(instant); const actual = Date.UTC(Number(parts.find((part) => part.type === 'year').value), Number(parts.find((part) => part.type === 'month').value) - 1, Number(parts.find((part) => part.type === 'day').value), Number(parts.find((part) => part.type === 'hour').value), Number(parts.find((part) => part.type === 'minute').value)); return new Date(instant.getTime() + Date.UTC(year, month - 1, day, hours, minutes) - actual); }
function formatLocal(event) { return new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(centralWallToInstant(eventDate(event), event.time)); }
function localEventDate(event) { return localDateKey(centralWallToInstant(eventDate(event), event.time)); }
function eventsForLocalDate(key) { return [addDays(key, -1), key, addDays(key, 1)].flatMap((gameDate) => eventsForDate(gameDate)).filter((event) => localEventDate(event) === key); }
function renderPicker() { const query = $('#boss-search').value.trim().toLowerCase(); const bosses = state.bosses.filter((boss) => boss.name.toLowerCase().includes(query)); $('#boss-picker').innerHTML = bosses.slice(0, 30).map((boss) => { const active = state.favorites.includes(boss.id); const favoriteIndex = state.favorites.indexOf(boss.id); const swatch = active ? `<span class="color-swatch favorite-${favoriteIndex % 5}" aria-hidden="true"></span>` : ''; return `<button class="boss-chip ${active ? 'active' : ''}" data-id="${boss.id}" type="button" aria-pressed="${active}" title="${active ? 'Remove from favorites' : 'Add to favorites'}"><span class="favorite-mark" aria-hidden="true">${active ? '★' : '☆'}</span>${swatch}<span>${boss.name}</span></button>`; }).join(''); document.querySelectorAll('.boss-chip').forEach((button) => button.addEventListener('click', () => toggleFavorite(button.dataset.id))); }
function toggleFavorite(id) { state.favorites = state.favorites.includes(id) ? state.favorites.filter((favorite) => favorite !== id) : [...state.favorites, id]; localStorage.setItem('throne-bosses-favorites', JSON.stringify(state.favorites)); renderPicker(); renderFavorites(); renderCalendar(); }
function renderFavorites() { const favorites = state.favorites.map((id, index) => ({ boss: state.bosses.find((boss) => boss.id === id), index })).filter((favorite) => favorite.boss); $('#selected-name').textContent = favorites.length ? `${favorites.length} boss${favorites.length === 1 ? '' : 'es'}` : 'Choose bosses'; $('#favorite-list').innerHTML = favorites.length ? favorites.map(({ boss, index }) => `<span class="favorite-name"><span class="color-swatch favorite-${index % 5}" aria-hidden="true"></span>${boss.name}</span>`).join('') : 'Select bosses above to add them here.'; }
function formatTime(time) { const [hour, minute] = time.split(':').map(Number); return new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(new Date(2020, 0, 1, hour, minute)); }
function discordTimestamp(event) { return Math.floor(centralWallToInstant(eventDate(event), event.time).getTime() / 1000); }
function copyText(text) { if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text); const area = document.createElement('textarea'); area.value = text; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove(); return Promise.resolve(); }
function copyLine(event) { return `${event.displayName}${event.guildPvp ? ' (Guild PvP)' : ''} - ${formatLocal(event)}`; }
function copyEvent(event) { return copyText(copyLine(event)); }
function copyDayEvents(key) { const events = eventsForLocalDate(key); const overnightEvents = eventsForLocalDate(addDays(key, 1)).filter((event) => Number(event.time.split(':')[0]) < 3); return [...events, ...overnightEvents]; }
function copyDay(key) { const now = new Date(); const events = copyDayEvents(key).filter((event) => centralWallToInstant(eventDate(event), event.time) > now).sort((a, b) => centralWallToInstant(eventDate(a), a.time) - centralWallToInstant(eventDate(b), b.time)); const groups = new Map(); events.forEach((event) => { const timestamp = discordTimestamp(event); if (!groups.has(timestamp)) groups.set(timestamp, []); groups.get(timestamp).push(event); }); const lines = [...groups].map(([timestamp, groupedEvents]) => `${groupedEvents.map((event) => `${event.displayName}${event.guildPvp ? ' (Guild PvP)' : ''}`).join(', ')} - ${formatLocal(groupedEvents[0])}`); return copyText(lines.join('\n')); }
function renderCalendar() { const month = state.month.getMonth(); const year = state.month.getFullYear(); const currentMonth = new Date(); const isCurrentMonth = month === currentMonth.getMonth() && year === currentMonth.getFullYear(); $('#month-label').textContent = new Intl.DateTimeFormat(undefined, { month: 'long', year: 'numeric' }).format(state.month); $('#previous-month').disabled = isCurrentMonth; const first = new Date(year, month, 1); const daysInMonth = new Date(year, month + 1, 0).getDate(); const today = localDateKey(new Date()); const cells = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map((day) => `<div class="weekday" role="columnheader">${day}</div>`); for (let index = 0; index < first.getDay(); index += 1) cells.push('<div class="day empty" aria-hidden="true"></div>'); for (let dayNumber = 1; dayNumber <= daysInMonth; dayNumber += 1) { const date = new Date(year, month, dayNumber); const key = date.toISOString().slice(0, 10); const dayEvents = eventsForLocalDate(key); const events = state.favorites.length ? dayEvents.filter(isFavorite).sort((a, b) => centralWallToInstant(eventDate(a), a.time) - centralWallToInstant(eventDate(b), b.time)) : []; const past = key < today; cells.push(`<div class="day ${past ? 'past' : ''} ${key === today ? 'today' : ''}" role="gridcell"><div class="day-header"><span class="day-number">${dayNumber}</span><button class="copy-button" type="button" data-copy-day="${key}" aria-label="Copy remaining bosses for ${key}" title="Copy remaining bosses">⧉</button></div>${events.map((event) => { const favoriteIndex = state.favorites.indexOf(event.name); const eventLabel = `${event.displayName} at ${formatTime(event.time)}`; return `<span class="spawn favorite-${favoriteIndex % 5} ${event.guildPvp ? 'guild-pvp' : ''} ${event.predicted ? 'predicted' : ''}" title="${eventLabel}" aria-label="${eventLabel}"><span>${formatTime(event.time)}</span><small>${event.displayName}</small>${event.guildPvp ? '<small>Guild PvP</small>' : ''}<button class="copy-button" type="button" data-copy-event="${event.gameDate}|${event.time}|${event.name}" aria-label="Copy ${eventLabel}" title="Copy Discord timer">⧉</button></span>`; }).join('')}</div>`); } $('#calendar').innerHTML = cells.join(''); document.querySelectorAll('[data-copy-day]').forEach((button) => button.addEventListener('click', () => copyDay(button.dataset.copyDay))); document.querySelectorAll('[data-copy-event]').forEach((button) => button.addEventListener('click', () => { const [gameDate, time, name] = button.dataset.copyEvent.split('|'); copyEvent({ gameDate, time, name, displayName: eventDisplayName(name) }); })); updateNextSpawn(); }
function markPassedEvents() { const now = new Date(); document.querySelectorAll('.day').forEach((day) => { const key = day.querySelector('[data-copy-day]')?.dataset.copyDay; if (!key) return; const events = eventsForLocalDate(key).filter(isFavorite).sort((a, b) => centralWallToInstant(eventDate(a), a.time) - centralWallToInstant(eventDate(b), b.time)); day.querySelectorAll('.spawn').forEach((spawn, index) => { const event = events[index]; if (event) spawn.classList.toggle('passed', centralWallToInstant(eventDate(event), event.time) <= now); }); }); }
const baseRenderCalendar = renderCalendar;
renderCalendar = () => { baseRenderCalendar(); markPassedEvents(); };
function updateNextSpawn() { if (!state.favorites.length) { $('#next-spawn').textContent = 'Favorite a boss to see its next spawn.'; return; } const now = new Date(); const candidates = []; for (let offset = -1; offset < 60; offset += 1) { const key = addDays(localDateKey(now), offset); eventsForLocalDate(key).filter(isFavorite).forEach((event) => candidates.push({ event, when: centralWallToInstant(eventDate(event), event.time) })); } const next = candidates.sort((a, b) => a.when - b.when).find((candidate) => candidate.when > now); $('#next-spawn').textContent = next ? `Next favorite · ${formatLocal(next.event)}` : 'No upcoming spawn found.'; }
function finishLoad() { state.bosses = buildBossList(state.schedule); const available = new Set(state.bosses.map((boss) => boss.id)); state.favorites = savedFavorites().filter((id) => available.has(id)); if (!state.favorites.length) state.favorites = state.bosses.slice(0, 1).map((boss) => boss.id); renderPicker(); renderFavorites(); renderCalendar(); }
async function load() { try { const response = await fetch(SOURCE); if (!response.ok) throw new Error('Schedule unavailable'); state.schedule = await response.json(); finishLoad(); } catch (error) { if (!FALLBACK) { $('#selected-name').textContent = 'Schedule unavailable'; $('#next-spawn').textContent = 'Check your connection and refresh the page.'; return; } state.schedule = FALLBACK; finishLoad(); } }
$('#boss-search').addEventListener('input', renderPicker); $('#today-button').addEventListener('click', () => { state.month = new Date(); renderCalendar(); }); $('#toggle-past').addEventListener('click', () => { const section = document.querySelector('.calendar-section'); const showing = section.classList.toggle('hide-past') === false; $('#toggle-past').textContent = showing ? 'Hide past' : 'Show past'; $('#toggle-past').setAttribute('aria-pressed', String(showing)); }); $('#previous-month').addEventListener('click', () => { const currentMonth = new Date(); if (state.month.getFullYear() === currentMonth.getFullYear() && state.month.getMonth() === currentMonth.getMonth()) return; state.month.setMonth(state.month.getMonth() - 1); renderCalendar(); }); $('#next-month').addEventListener('click', () => { state.month.setMonth(state.month.getMonth() + 1); renderCalendar(); }); load();
  </script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  </script>
